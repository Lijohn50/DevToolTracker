<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>My Requests — DevTrack</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/user.css">
</head>
<body>

<div th:replace="~{fragments/layout :: shell('My Requests', 'my-requests', ~{::section})}"></div>

<section>
  <div class="content-header">
    <div>
      <p class="subtitle">Every tool request you've submitted and its current status.</p>
    </div>
    <a href="/user/request-tool" class="btn btn-primary">+ Request a Tool</a>
  </div>

  <table class="data-table" th:if="${#lists.size(myRequests) > 0}">
    <thead>
      <tr>
        <th>Tool</th>
        <th>Requested</th>
        <th>Note</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="r : ${myRequests}">
        <td th:text="${r.tool.name}">Tool</td>
        <td th:text="${#temporals.format(r.requestedDate, 'MMM d, yyyy')}">date</td>
        <td th:text="${r.note != null and !r.note.isEmpty()} ? ${r.note} : '—'">note</td>
        <td>
          <span class="badge"
                th:classappend="${r.status.name() == 'APPROVED'} ? 'badge-approved' : (${r.status.name() == 'REJECTED'} ? 'badge-rejected' : 'badge-pending')"
                th:text="${r.status}">PENDING</span>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="panel empty-state" th:if="${#lists.size(myRequests) == 0}">
    You haven't requested any tools yet. <a href="/user/request-tool" style="color: var(--accent);">Request one</a>.
  </div>
</section>

</body>
</html>
