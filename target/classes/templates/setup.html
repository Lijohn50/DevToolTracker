<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — DevTrack</title>
  <link rel="stylesheet" href="/auth.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>

<div class="auth-shell">

  <div class="brand-tag">
    <span class="dot"></span>
    DEVTRACK / ADMIN CONSOLE
  </div>

  <div class="form-card">
    <div>
      <h1 class="form-title" style="text-align: center">Create your account</h1>
    </div>

    <form th:action="${formAction}" method="post" th:object="${registrationRequest}">
      <div class="field-group">
        <label class="field-label" for="name">NAME</label>
        <input type="text" id="name" name="name" class="field-input" placeholder="Your name" th:field="*{username}" required>
      </div>
      <input type="hidden" name="returnTo" th:field="*{id}">
      <div class="field-group">
        <label class="field-label" for="email">EMAIL</label>
        <input type="email" id="email" name="email" class="field-input" placeholder="you@company.com" th:field="*{email}" required>
      </div>
      <th:block sec:authorize="!isAuthenticated()">
        <th:block  sec:authorize="!hasRole('ADMIN')">
          <div class="field-group">
            <label class="field-label" for="password">PASSWORD</label>
            <input type="password" id="password" name="password" class="field-input" placeholder="Create a password" th:field="*{password}" required>
          </div>
        </th:block>
      </th:block>
      <th:block sec:authorize="hasRole('DIRECTOR')">
        <div class="field-group">
          <label class="field-label" for="password">PASSWORD</label>
          <input type="password" id="password" name="password" class="field-input" placeholder="Create a password" th:field="*{password}" required>
        </div>
      </th:block>
      <button type="submit" class="submit-btn">Create account</button>
    </form>
    <th:block sec:authorize="isAuthenticated() and hasRole('USER')">
      <div class="panel panel-padded">
        <h2 class="section-title">Change password</h2>
        <form th:action="@{/user/update-password}" method="post">

          <div class="field-group" style="margin-bottom: 16px;">
            <label class="field-label" for="currentPassword">CURRENT PASSWORD</label>
            <input type="password" id="currentPassword" name="currentPassword" class="field-input">
          </div>

          <div class="field-group" style="margin-bottom: 16px;">
            <label class="field-label" for="newPassword">NEW PASSWORD</label>
            <input type="password" id="newPassword" name="newPassword" class="field-input">
          </div>
          <button type="submit" class="submit-btn">Update Password</button>
        </form>
      </div>
      <a th:href="@{/user/dashboard}" class="btn btn-primary">< Back</a>
    </th:block>
  </div>
</div>

</body>
</html>
