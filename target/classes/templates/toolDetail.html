<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${tool.name} + ' — DevTrack'">Tool — DevTrack</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>

<div th:replace="~{fragments/layout :: shell('Tools', 'tools', ~{::section})}"></div>

<section>

  <div class="content-header">
    <div>
      <h1 class="page-title" style="font-size:19px; margin:0;" th:text="${tool.name}">Tool Name</h1>
      <p class="subtitle" th:text="${tool.vendor}">Vendor</p>
    </div>
    <div class="row-actions">
      <a th:href="@{/tools/{id}/edit(id=${tool.id})}" class="btn btn-secondary btn-sm">Edit</a>
      <form th:action="@{/tools/{id}/delete(id=${tool.id})}" method="post"
            onsubmit="return confirm('Delete this tool? This cannot be undone.');">
        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
      </form>
    </div>
  </div>

  <div class="detail-grid">

    <!-- Left column: tool info + utilization -->
    <div class="panel panel-padded">
      <h2 class="section-title">Details</h2>

      <div class="info-row">
        <span class="label">Category</span>
        <span class="value" th:text="${tool.category}">Category</span>
      </div>
      <div class="info-row">
        <span class="label">License Type</span>
        <span class="value">
          <span class="badge"
                th:classappend="${tool.licenseType == 'PAID'} ? 'badge-paid' : (${tool.licenseType == 'TRIAL'} ? 'badge-trial' : 'badge-free')"
                th:text="${tool.licenseType}">PAID</span>
        </span>
      </div>
      <div class="info-row">
        <span class="label">Cost / Seat</span>
        <span class="value" th:text="${'$' + #numbers.formatDecimal(tool.costPerSeat, 1, 2)}">$0.00</span>
      </div>
      <div class="info-row">
        <span class="label">Seats Purchased</span>
        <span class="value" th:text="${tool.seatsPurchased}">0</span>
      </div>
      <div class="info-row">
        <span class="label">Renews</span>
        <span class="value" th:text="${#temporals.format(tool.renewalDate, 'MMM d, yyyy')}">date</span>
      </div>

      <h2 class="section-title" style="margin-top:26px;">Seat Utilization</h2>
      <div class="info-row" style="border-bottom:none; padding-bottom:0;">
        <span class="label">Used</span>
        <span class="value" th:text="${tool.seatsUsed} + ' / ' + ${tool.seatsPurchased}">0 / 0</span>
      </div>
      <div class="utilization-bar-track">
        <div class="utilization-bar-fill" th:style="'width: ' + ${tool.utilizationPercent} + '%'"></div>
      </div>
    </div>

    <!-- Right column: assigned developers + assign form -->
    <div class="panel panel-padded">
      <h2 class="section-title">Assigned Developers</h2>

      <table class="data-table" th:if="${#lists.size(tool.assignedDevelopers) > 0}">
        <thead>
          <tr>
            <th>Developer</th>
            <th>Email</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="dev : ${tool.assignedDevelopers}">
            <td>
              <a th:href="@{/developers/{id}(id=${dev.id})}" class="row-link" th:text="${dev.username}">Developer</a>
            </td>
            <td th:text="${dev.email}">email</td>
            <td>
              <div class="row-actions">
                <form th:action="@{/tools/{toolId}/unassign/{devId}(toolId=${tool.id}, devId=${dev.id})}" method="post">
                  <button type="submit" class="btn btn-danger btn-sm">Unassign</button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="empty-state" th:if="${#lists.size(tool.assignedDevelopers) == 0}">
        No developers are assigned to this tool yet.
      </div>

      <form th:action="@{/tools/{id}/assign(id=${tool.id})}" method="post" class="assign-form">
        <div class="field-group">
          <label class="field-label" for="developerId">ASSIGN DEVELOPER</label>
          <select id="developerId" name="developerId" class="field-select">
            <option value="" disabled selected>Select a developer&hellip;</option>
            <option th:each="dev : ${unassignedDevelopers}"
                    th:value="${dev.id}"
                    th:text="${dev.username} + ' (' + ${dev.email} + ')'">Developer</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Assign</button>
      </form>
    </div>

  </div>

</section>

</body>
</html>
