<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon — DevTrack</title>

    <link rel="stylesheet" href="/app.css">

    <style>

        .coming-soon-wrapper {
            min-height: calc(100vh - 80px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .coming-soon-card {
            width: 100%;
            max-width: 560px;
            text-align: center;
            padding: 55px 45px;
            background: #1B2432;
            border: 1px solid #2E3F63;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .coming-soon-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(76, 141, 255, 0.12);
            border: 1px solid rgba(76, 141, 255, 0.35);

            color: #4C8DFF;
            font-size: 30px;
        }

        .coming-soon-title {
            margin: 0 0 12px;

            color: #F5F7FA;
            font-size: 30px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .coming-soon-subtitle {
            margin: 0 auto 30px;
            max-width: 430px;

            color: #8993A6;
            font-size: 15px;
            line-height: 1.7;
        }

        .coming-soon-line {
            width: 55px;
            height: 3px;
            margin: 0 auto 30px;

            border-radius: 10px;
            background: #4C8DFF;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 10px 20px;

            border-radius: 6px;
            border: 1px solid #34445F;

            background: transparent;
            color: #F5F7FA;

            text-decoration: none;
            font-size: 14px;
            font-weight: 500;

            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: #243149;
            border-color: #4C8DFF;
            color: #FFFFFF;
        }

        .back-arrow {
            font-size: 16px;
        }

    </style>
</head>

<body>

<div class="coming-soon-wrapper">

    <div class="coming-soon-card">

        <div class="coming-soon-icon">
            ⚡
        </div>

        <h1 class="coming-soon-title">
            Coming Soon
        </h1>

        <div class="coming-soon-line"></div>

        <p class="coming-soon-subtitle">
            We're working on something useful for you.
            This section of DevTrack is currently under development
            and will be available soon.
        </p>

        <a href="/user/assigned-tools" class="back-btn">
            <span class="back-arrow">←</span>
            Back
        </a>

    </div>

</div>

</body>
</html>
