<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="shell(pageTitle, activeNav, content)">
  <div class="app-shell">

    <aside class="sidebar">
      <div class="brand-tag">
        <span class="dot"></span>
        DEVTRACK
      </div>

      <nav class="side-nav">
        <a href="/admin/dashboard" class="nav-item" th:classappend="${activeNav == 'dashboard'} ? 'active'" sec:authorize="hasRole('ADMIN')">Dashboard</a>
        <a href="/user/dashboard" class="nav-item" th:classappend="${activeNav == 'dashboard'} ? 'active'" sec:authorize="hasRole('USER')">Dashboard</a>

        <!-- Admin-only links -->
        <th:block sec:authorize="hasRole('ADMIN')">
          <a href="/admin/tools-list" class="nav-item" th:classappend="${activeNav == 'tools'} ? 'active'">Tools</a>
          <a href="/admin/add-tools" class="nav-item" th:classappend="${activeNav == 'tools'} ? 'active'">Add New Tool</a>
          <a href="/admin/user-list" class="nav-item" th:classappend="${activeNav == 'developers'} ? 'active'">Developers</a>
        </th:block>

        <!-- User-only links -->
        <th:block sec:authorize="!hasRole('ADMIN')">
          <a href="/user/assigned-tools" class="nav-item" th:classappend="${activeNav == 'my-tools'} ? 'active'">My Tools</a>
          <a href="/user/request-tool" class="nav-item" th:classappend="${activeNav == 'my-requests'} ? 'active'">My Requests</a>
          <a href="/user/update-info" class="nav-item" th:classappend="${activeNav == 'profile'} ? 'active'">Profile</a>
        </th:block>
      </nav>

      <form th:action="@{/logout}" method="post" class="logout-form">
        <button type="submit" class="nav-item logout-btn">Sign out</button>
      </form>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <h1 class="page-title" th:text="${pageTitle}">Page title</h1>
        <span class="signed-in-as" sec:authorize="isAuthenticated()">
          Signed in as <strong sec:authentication="name">User</strong>
        </span>
      </header>

      <main class="content">
        <div th:replace="${content}"></div>
      </main>
    </div>

  </div>
</div>

</body>
</html>
