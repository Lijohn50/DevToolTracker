<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Developers — DevTrack</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>

<div th:replace="~{fragments/layout :: shell('Developers', 'developers', ~{::section})}"></div>

<section>
  <div class="content-header">
    <div>
      <p class="subtitle">Everyone who has registered as a developer.</p>
    </div>
  </div>
  <table class="data-table" th:if="${#lists.size(developers) > 0}">
    <thead>
    <tr>
      <th>Username</th>
      <th>Email</th>
      <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="dev : ${developers}">
      <td th:text="${dev.username}"></td>
      <td th:text="${dev.email}">email</td>
      <td>
        <div class="row-actions">
          <a th:href="@{/admin/user-list/{id}/edit(id=${dev.id})}" class="btn btn-secondary btn-sm">Edit</a>
          <form th:action="@{/admin/user-list/{id}/delete(id=${dev.id})}" method="post"
                onsubmit="return confirm('Remove this developer account? This cannot be undone.');">
            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
          </form>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
  <div class="panel empty-state" th:if="${#lists.size(developers) == 0}">
    No developers have registered yet.
  </div>
</section>

</body>
</html>
